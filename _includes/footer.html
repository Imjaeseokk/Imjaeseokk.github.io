<footer class="site-footer">
  <div class="footer-intro">
    <span class="brand-mark" aria-hidden="true"></span>
    <p>Building useful systems across hardware and software.</p>
  </div>
  <div class="footer-links">
    <div><small>CONTACT</small><a class="icon-link" href="mailto:{{ site.email }}"><i class="fa-regular fa-envelope" aria-hidden="true"></i><span>Email ↗</span></a></div>
    <div class="social-directory"><small>SOCIAL & WRITING</small>{% for social in site.data.profile.socials %}<a class="icon-link" href="{{ social.url }}" target="_blank" rel="noreferrer">{% if social.icon %}<i class="{{ social.icon }}" aria-hidden="true"></i>{% else %}<i class="letter-icon" aria-hidden="true">{{ social.mark }}</i>{% endif %}<span>{{ social.label }} ↗</span></a>{% endfor %}</div>
    <div><small>LOCAL TIME</small><span id="local-time">KST</span><span>© <span id="year">{{ 'now' | date: '%Y' }}</span></span></div>
  </div>
</footer>
