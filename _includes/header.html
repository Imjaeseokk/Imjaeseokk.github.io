<header class="site-header">
  <a class="brand" href="{{ '/' | relative_url }}" aria-label="Jaeseok Heo home">
    <span class="brand-mark" aria-hidden="true"></span>
    <span>ENGINEER · BUILDER · STUDENT</span>
  </a>
  <div class="header-right">
  <nav id="site-nav" class="site-nav" aria-label="Primary navigation">
    <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
    <a href="{{ '/work/' | relative_url }}"{% if page.url contains '/work' %} aria-current="page"{% endif %}>Work</a>
    <a href="{{ '/library/' | relative_url }}"{% if page.url contains '/library' %} aria-current="page"{% endif %}>Library</a>
    <a href="{{ '/notes/' | relative_url }}"{% if page.url contains '/notes' %} aria-current="page"{% endif %}>Notes</a>
    <a href="{{ '/readlog/' | relative_url }}"{% if page.url contains '/readlog' %} aria-current="page"{% endif %}>Readlog</a>
  </nav>
  <div class="header-actions">
    <button class="theme-toggle" type="button" aria-label="Toggle color theme">◐</button>
    <button class="language-toggle" type="button" aria-label="Switch to English" title="Switch to English">
      <svg class="language-icon language-icon-en" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true" focusable="false"><path d="M5 20 12 4 19 20M8 14h8"/></svg>
      <svg class="language-icon language-icon-ko" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true" focusable="false"><path d="M5 5h14v15"/></svg>
    </button>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
      <span class="sr-only">Toggle navigation</span><span></span><span></span>
    </button>
  </div>
  </div>
</header>
